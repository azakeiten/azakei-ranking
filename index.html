<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>本日の億万長者｜AZAKEI 麻布経済展</title>
<meta name="description" content="麻布経済展（AZAKEI）のチップ獲得ランキング。チップ5枚からスタートして、いちばん増やしたのはだれ？">
<meta property="og:title" content="本日の億万長者｜AZAKEI 麻布経済展">
<meta property="og:description" content="チップ5枚からスタート。麻布経済展のチップ獲得ランキング。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://azakeiten.github.io/azakei-ranking/">
<meta name="theme-color" content="#b5432f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23fff' font-family='Arial Narrow,Arial' font-weight='700'%3E1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Shippori+Mincho:wght@600;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <a class="event" href="https://azakeiten.github.io/"><b>麻布経済展</b><span>AZAKEI 2026</span></a>
  <div class="status"><span class="live" id="live">速報</span><span class="clock" id="clock">--:--:--</span></div>
</header>

<section class="head">
  <div class="head-text">
    <h1 id="title">本日の億万長者</h1>
    <p class="sub">チップ獲得枚数（スタート5枚）</p>
  </div>
  <nav class="days" id="days" aria-label="日付" hidden></nav>
</section>

<div class="flash" id="flash" role="status" hidden></div>

<main class="sheet">
  <div class="thead" aria-hidden="true"><span>順位</span><span>名前</span><span class="r c-time">時刻</span><span class="r c-mult">倍率</span><span class="r">記録</span><span></span></div>
  <ol class="results" id="rows"></ol>
  <p class="empty" id="empty">記録はまだありません。</p>
  <section class="more" id="more" hidden>
    <div class="more-head"><span id="moreHead"></span><button class="pager" id="pager" type="button" hidden></button></div>
    <ol class="rest" id="rest"></ol>
  </section>
  <p class="status-msg" id="status" role="status"></p>
</main>

<footer class="foot">
  <dl class="stats" id="stats"></dl>
  <p class="legend"><b>景品</b>41枚以上<b class="rec">大会新</b>前回の最高記録を更新</p>
  <div class="find">
    <label for="findName">自分の順位</label>
    <input id="findName" type="search" autocomplete="off" spellcheck="false" placeholder="名前を入力">
    <span id="findResult" role="status"></span>
  </div>
  <div class="ctl">
    <span id="adminBar" class="admin-tag" hidden>管理者</span>
    <button class="btn" id="showBtn" type="button">結果発表</button>
    <button class="btn" id="fsBtn" type="button">全画面</button>
  </div>
  <div class="qr" id="qrPanel" hidden><div class="qr-code" id="qr"></div><span>スマホで見る</span></div>
</footer>

<form class="admin" id="form" autocomplete="off" hidden>
  <p class="admin-title">記録の入力</p>
  <div id="passBox" class="stack">
    <label for="pass">合言葉<input id="pass" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <button class="submit" id="passBtn" type="button">入力をはじめる</button>
  </div>
  <div id="entryBox" class="stack" hidden>
    <label for="name">名前<input id="name" maxlength="20"></label>
    <label for="chips">枚数
      <span class="chips-row">
        <button class="step" type="button" data-step="-1" aria-label="1枚減らす">−</button>
        <input id="chips" type="number" inputmode="numeric" min="0" max="99999" value="5">
        <button class="step" type="button" data-step="1" aria-label="1枚増やす">＋</button>
      </span>
    </label>
    <label for="date">日付<input id="date" type="date"></label>
    <button class="submit" id="submit" type="submit">記録する</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
  <p class="hint">記録はお客さん側の画面にも数秒で反映されます。まちがえた記録は一覧の「取消」で消せます。</p>
  <button class="linkish" id="forget" type="button" hidden>この端末の合言葉を忘れる</button>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
